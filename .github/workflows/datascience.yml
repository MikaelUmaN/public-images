name: Datascience Image CI
run-name: ${{ inputs.image }} push=${{ inputs.push }}

on: # Only manual runs because the idea is to have multiple images and choose what to build.
  workflow_dispatch:
    inputs:
      image:
        type: choice
        description: Image to build
        default: datascience
        options:
        - datascience
        - net-datascience
        - rust-datascience
        - quarto-datascience
        - latex
        - pico
      push:
        type: boolean
        description: Push the image to Docker Hub after the smoke test
        default: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set Docker Tag
      id: docker-tag
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
        else
          echo "TAG=latest" >> $GITHUB_ENV
        fi

    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Docker image
      run: docker build . --file ${{ github.event.inputs.image }}.docker --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image }}:${{ env.TAG }}

    - name: Smoke test
      run: docker run --rm -v "$PWD/tests:/tests:ro" ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image }}:${{ env.TAG }} bash /tests/smoke/${{ github.event.inputs.image }}.sh

    - name: Push Docker Image
      if: ${{ inputs.push }}
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image }}:${{ env.TAG }}
