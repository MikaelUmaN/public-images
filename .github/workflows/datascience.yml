name: Datascience Image CI
run-name: ${{ inputs.image }} push=${{ inputs.push }}

on: # Only manual runs because the idea is to have multiple images and choose what to build.
  workflow_dispatch:
    inputs:
      image:
        type: choice
        description: Image to build
        default: datascience
        options:
        - datascience
        - net-datascience
        - rust-datascience
        - quarto-datascience
        - latex
        - pico
      push:
        type: boolean
        description: Push the image to Docker Hub after the smoke test
        default: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Launcher tests
      run: python3 -B tests/test_launcher.py -v

    # Only the default branch publishes latest; any other branch publishes a tag named after it.
    - name: Set Docker Tag
      id: docker-tag
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          tag="${GITHUB_REF_NAME}"
        elif [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
          tag=latest
        else
          tag="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)"
          tag="${tag#[.-]}"
          [[ -n "$tag" && "$tag" != latest ]] || { echo "Branch ${GITHUB_REF_NAME} has no safe image tag" >&2; exit 1; }
        fi
        echo "TAG=${tag}" >> "$GITHUB_ENV"

    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Docker image
      run: docker build . --file ${{ github.event.inputs.image }}.docker --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image }}:${{ env.TAG }}

    - name: Smoke test
      run: docker run --rm --env SMOKE_SLOW=1 -v "$PWD/tests:/tests:ro" ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image }}:${{ env.TAG }} bash /tests/smoke/${{ github.event.inputs.image }}.sh

    - name: Runtime account tests
      env:
        RUNTIME_TEST_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image }}:${{ env.TAG }}
      run: python3 -B tests/test_runtime_user.py -v

    - name: Push Docker Image
      if: ${{ inputs.push }}
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image }}:${{ env.TAG }}
